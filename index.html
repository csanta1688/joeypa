<style>
    body{
      background: url('starsky.gif') fixed;
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
      color: #ffffff;
    }
    .wrap{
      width: 100%;
      min-height: 100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding: 24px 0;
      box-sizing: border-box;
    }
    .panel{
      width: 760px;
      max-width: calc(100% - 24px);
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      padding: 18px 18px 22px;
      box-sizing: border-box;
    }
    .logo{
      width: 210px;
      max-width: 92%;
      height: auto;
      display:block;
      margin: 6px auto 14px;
    }
    .row{
      text-align:center;
      margin-top: 10px;
    }
    select, button{
      font-size: 14px;
      padding: 6px 10px;
      margin: 0 6px;
    }

    /* ✅ SEO：不影響畫面，但讓搜尋引擎讀到 H1/導讀（避免薄內容） */
    .visually-hidden{
      position:absolute !important;
      width:1px !important; height:1px !important;
      padding:0 !important; margin:-1px !important;
      overflow:hidden !important;
      clip:rect(0 0 0 0) !important;
      white-space:nowrap !important;
      border:0 !important;
    }
    .seo-intro{
      max-width: 640px;
      margin: 10px auto 0;
      padding: 0 6px;
      font-size: 13px;
      line-height: 1.7;
      opacity: .92;
      text-align: center;
    }
    .seo-links{
      margin-top: 10px;
      text-align: center;
      font-size: 12px;
      opacity: .9;
    }
    .seo-links a{
      color: #ffffff;
      text-decoration: underline;
    }
  </style>

  <script>
    // ===== 語言選擇：寫入 localStorage.site_lang，交由 translate_bootstrap.js 全站套用 =====
    const SITE_LANG_KEY = "site_lang";

    function getSavedLang(){
      try{ return localStorage.getItem(SITE_LANG_KEY) || "original"; }catch(e){ return "original"; }
    }

    function initLangUI(){
      const sel = document.getElementById("langSelect");
      if(!sel) return;
      sel.value = getSavedLang();

      sel.addEventListener("change", function(){
        const lang = sel.value || "original";
        try{ localStorage.setItem(SITE_LANG_KEY, lang); }catch(e){}
        if (window.__gt_set_lang) window.__gt_set_lang(lang);
      });
    }

    function goMain(){
      const sel = document.getElementById("langSelect");
      const lang = sel ? (sel.value || "original") : getSavedLang();
      try{ localStorage.setItem(SITE_LANG_KEY, lang); }catch(e){}
      if (window.__gt_set_lang) window.__gt_set_lang(lang);
      window.location.href = "main.htm";
    }
  </script>
</head>

<body onload="initLangUI()">

  <!-- ✅ SEO：入口頁加 H1/導讀（隱藏不破壞版面） -->
  <h1 class="visually-hidden">茂果科技 (JOEYPA)－專業的電子產品設計代工，各種自動控制解決方案</h1>

  <div class="wrap">
    <div class="panel">
      <img class="logo" src="serlogo.jpg" alt="茂果科技 (JOEYPA) LOGO">

      <div class="row">
        <label for="langSelect" class="visually-hidden">選擇語言</label>
        <select id="langSelect" aria-label="選擇語言">
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="vi">Tiếng Việt</option>
          <option value="th">ไทย</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="ar">العربية (Arabic)</option>
          <option value="fa">فارسی (Farsi)</option>
          <option value="tr">Türkçe (Turkish)</option>
          <option value="zh-CN">简体中文</option>
          <option value="original">繁體中文</option>
        </select>

        <button onclick="goMain()" aria-label="進入首頁">ENTER</button>
      </div>


      <!-- ✅ SEO 補強：多一段「入口頁導讀」（不破壞排版） -->
      <div class="seo-intro">
        本公司(茂果科技 JOEYPA)提供各類電子產品設計與代工製造等ODM相關服務，並銷售自家生產的充電器、副電瓶隔離器、多功能定時器、遠端控制與回報系統等相關產品與解決方案，並包含各類家用、車用相關電器周邊應用整合。為方便國際使用者，網站提供 Google 翻譯，請選擇語言後進入。
      </div>

      <!-- ✅ 內部連結（可選）：讓爬蟲更容易走到主頁/產品/消息（不影響使用者也可） -->
      <div class="seo-links">
        快速連結：
        <a href="main.htm">首頁</a> |
        <a href="product.htm">產品</a> |
        <a href="news.htm">最新消息</a> |
        <a href="contact.htm">聯絡我們</a>
      </div>

      <!-- 隱藏的 Google 翻譯容器（重要：不能 display:none） -->
      <div id="google_translate_element"
           style="position:absolute; left:-9999px; top:0; width:1px; height:1px; overflow:hidden;"></div>

      <noscript>
        <p style="text-align:center; margin-top:20px;">
          對不起！您的瀏覽器不支援 JavaScript，無法使用翻譯功能。
        </p>
        <p style="text-align:center;">
          <a href="main.htm" style="color:#ffffff;">直接進入</a>
        </p>
      </noscript>
    </div>
  </div>

  <script src="translate_bootstrap.js"></script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
