<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>最新消息 / 新消息發布</title>

  <!-- ✅ 若你原本網站有共用 CSS（建議沿用以一致化），取消註解並改成你的路徑 -->
  <!-- <link rel="stylesheet" href="./css/common.css"> -->

  <style>
    /* =========================
       0) 基本一致化設定
       ========================= */
    :root{
      --main-border: #caa25a;
      --main-blue: #2a66ff;
      --card-bg: #f6f3ea;      /* 消息卡片底色 */
      --title-red: #d00000;
      --text-black: #222;

      --shadow: 0 2px 10px rgba(0,0,0,0.06);
      --shadow-hover: 0 10px 24px rgba(0,0,0,0.14);

      --card-border: rgba(0,0,0,0.10);
      --card-border-hover: rgba(42,102,255,0.35);
    }

    body{
      margin:0;
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", Arial, sans-serif;
      color: var(--text-black);
      background:#ffffff;
    }

    /* =========================
       1) 左側固定按鍵區（左側中間、三按鍵）
       ========================= */
    .left-nav {
      position: fixed;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 999;
    }

    .nav-btn{
      min-width: 120px;
      padding: 10px 14px;
      border-radius: 28px;
      border: 2px solid var(--main-border);
      background: #fff;
      color: var(--main-blue);
      font-size: 16px;
      cursor: pointer;
      box-shadow: var(--shadow);
      text-align: center;
      user-select: none;
    }
    .nav-btn:hover{
      filter: brightness(0.98);
    }

    /* =========================
       2) 中間大框（置中、邊框、上方Logo固定）
       ========================= */
    .page-wrap{
      width: 100%;
      min-height: 100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding: 60px 20px; /* 上下留白 */
      box-sizing: border-box;
    }

    .main-frame{
      width: min(1050px, 92vw);
      border: 3px solid var(--main-border);
      border-radius: 18px;
      padding: 26px 28px 22px;
      box-sizing: border-box;
      background:#fff;
      position: relative;
    }

    /* ✅ 大框架上方中間固定圖檔（image001.gif） */
    .frame-top-logo{
      display:flex;
      justify-content:center;
      align-items:center;
      margin: 2px 0 10px 0;
      user-select: none;
    }
    .frame-top-logo img{
      max-width: 240px;     /* 你可調整 */
      height: auto;
      display:block;
    }

    /* 中間標題 */
    .page-title{
      text-align:center;
      color: var(--main-blue);
      font-size: 28px;
      margin: 0 0 14px 0;
      letter-spacing: 1px;
    }

    /* =========================
       3) 消息列表容器：可捲動
       ========================= */
    .news-scroll{
      height: 70vh;
      overflow-y: auto;
      padding: 10px 8px;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    /* =========================
       4) 單筆消息卡片（可複製套用） + hover 高亮/陰影變化
       ========================= */
    .news-item{
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 14px;
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 14px;
      align-items: start;
      border: 1px solid var(--card-border);
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
      margin: 14px 0;

      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, filter 160ms ease;
      will-change: transform, box-shadow;
    }

    /* ✅ hover 效果：更亮、陰影更重、微上浮、邊框帶藍 */
    .news-item:hover{
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--card-border-hover);
      filter: brightness(1.02);
    }

    .news-item img{
      width: 120px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      background:#eee;
      border: 1px solid rgba(0,0,0,0.10);
      display:block;
    }

    .news-text .news-title{
      margin: 0;
      padding: 0;
      color: var(--title-red);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.15;
    }

    .news-text .news-body{
      margin: 0;
      color: var(--text-black);
      font-size: 16px;
      line-height: 1.35;
      white-space: pre-line;
    }

    /* 小螢幕調整 */
    @media (max-width: 720px){
      .left-nav { left: 10px; }
      .nav-btn { min-width: 96px; font-size: 14px; padding: 9px 12px; }
      .main-frame{ padding: 20px 16px; }
      .page-title{ font-size: 22px; }
      .frame-top-logo img{ max-width: 180px; }
    }
  </style>

  <script>
    /* ===== Google 翻譯繼承（從 main.htm 同步而來，NEWS 不顯示語言下拉）===== */
    const SITE_FROM_LANG = "zh-TW";
    const SITE_LANG_KEY  = "site_lang";
    const SITE_LANG_LIST = "en,ja,ko,zh-CN,fr,de,es,vi,th,id,ar,fa,tr,zh-TW";

    function setGoogTransCookie(fromLang, toLang) {
      const v = "/" + fromLang + "/" + toLang;
      document.cookie = "googtrans=" + v + ";path=/";
      document.cookie = "googtrans=" + v + ";path=/;SameSite=Lax";
    }
    function clearGoogTransCookie() {
      document.cookie = "googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
      document.cookie = "googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;SameSite=Lax";
    }
    function getCookie(name){
      const m = document.cookie.match(new RegExp("(^|;\\s*)" + name + "=([^;]*)"));
      return m ? decodeURIComponent(m[2]) : "";
    }
    function getLangFromGoogtransCookie(){
      const gt = getCookie("googtrans"); // e.g. /zh-TW/ja
      const m = gt.match(/^\/([^\/]+)\/([^\/]+)$/);
      if(!m) return null;
      return { from: m[1], to: m[2] };
    }
    function getSavedLangSafe() {
      const v = localStorage.getItem(SITE_LANG_KEY);
      if (v && v !== "null" && v !== "undefined") return v;

      const gt = getLangFromGoogtransCookie();
      if (gt && gt.to) return gt.to;

      return "original";
    }

    // 進頁先把 cookie 套好（讓 element.js 初始化時讀得到）
    (function autoApplySavedLang(){
      const lang = getSavedLangSafe();
      if (lang === "original") clearGoogTransCookie();
      else setGoogTransCookie(SITE_FROM_LANG, lang);
    })();

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: SITE_FROM_LANG,
        includedLanguages: SITE_LANG_LIST,
        autoDisplay: false
      }, 'google_translate_element');
    }

    // bfcache/返回時補強：確保仍沿用 main 的語言
    window.addEventListener("pageshow", function(){
      const lang = getSavedLangSafe();
      if (lang === "original") return;
      setGoogTransCookie(SITE_FROM_LANG, lang);
    });
  </script>
</head>

<body>

  <!-- ✅ 重點：保留 element 但移到畫面外（不要 display:none，避免翻譯不起來） -->
  <div id="google_translate_element"
       style="position:absolute; left:-9999px; top:0; width:1px; height:1px; overflow:hidden;"></div>

  <!-- =========================
       左側固定按鍵區（左側中間）
       ========================= -->
  <div class="left-nav">
    <a class="nav-btn" href="main.htm" style="text-decoration:none;">回首頁</a>
    <button class="nav-btn" type="button" id="btnTop">TOP</button>
    <button class="nav-btn" type="button" id="btnBottom">BOTTOM</button>
  </div>

  <!-- =========================
       中間內容大框
       ========================= -->
  <div class="page-wrap">
    <div class="main-frame">

      <div class="frame-top-logo">
        <img src="news.files/image001.gif" alt="Top Logo">
      </div>

      <h1 class="page-title">最新消息</h1>

      <div class="news-scroll" id="newsScroll">


<!-- ====================================最頂端第一條消息======================================================== -->

        <div class="news-item">
          <img src="news.files/N002.jpg" alt="News Image N002" width="120" height="80">
          <div class="news-text">
            <div class="news-title">2026開年新作-機車專用多功能充電器即將上市！</div>
            <p class="news-body">
            2026 /02 /01
            ●市面上第一部專為機車族設計的多功能充電器
            ●全DIY模組設計，需要多少功能買多少模組DIY
            ●讓機車用電像汽車一樣簡單，更是重機族救星
            </p>
          </div>
        </div>


<!-- ====================================第二條消息============================================================== -->

        <div class="news-item">
          <img src="news.files/N001.jpg" alt="News Image N001" width="120" height="80">
          <div class="news-text">
            <div class="news-title"> 總經理攜代理商夥伴登頂日本阿爾卑斯山 </div>
            <p class="news-body">
            2025 /11 /24
            冰天雪地下頂著寒風冷冽，總經理帶著代理商夥伴們共同提攜登頂日本阿爾卑斯山頂，展現出同舟共濟，事業共同體堅定互助合作的意念！
            </p>
          </div>
        </div>



<!-- ====================================以下為公用程式不可亂修改================================================= -->

      </div>
    </div>
  </div>

  <script>
    // ========= TOP / BOTTOM：定位到第一筆 / 最後一筆（框內捲動） =========
    (function(){
      const scrollBox = document.getElementById('newsScroll');
      const btnTop = document.getElementById('btnTop');
      const btnBottom = document.getElementById('btnBottom');

      function getItems(){
        return scrollBox ? Array.from(scrollBox.querySelectorAll('.news-item')) : [];
      }

      function scrollToItem(item){
        if(!scrollBox || !item) return;
        const boxRect = scrollBox.getBoundingClientRect();
        const itemRect = item.getBoundingClientRect();
        const delta = (itemRect.top - boxRect.top);
        const targetTop = scrollBox.scrollTop + delta - 8;
        scrollBox.scrollTo({ top: targetTop, behavior: 'smooth' });
      }

      btnTop?.addEventListener('click', () => {
        const items = getItems();
        if(items.length > 0) scrollToItem(items[0]);
      });

      btnBottom?.addEventListener('click', () => {
        const items = getItems();
        if(items.length > 0) scrollToItem(items[items.length - 1]);
      });
    })();
  </script>

  <!-- element.js 放在 body 尾端，確保穩定初始化 -->
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
