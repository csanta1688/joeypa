<!-- =========================
     ✅ Google 翻譯：與 main.htm 同步（繼承語言）
     ========================= -->
<script>
  /* ===== Google 翻譯同步設定（main → 子頁）===== */
  const SITE_FROM_LANG = "zh-TW"; // 主站內容是繁中，統一以 zh-TW 為 source
  const SITE_LANG_KEY  = "site_lang";
  const SITE_LANG_LIST = "en,ja,ko,zh-CN,fr,de,es,vi,th,id,ar,fa,tr,zh-TW";

  function setGoogTransCookie(fromLang, toLang) {
    const v = "/" + fromLang + "/" + toLang;
    document.cookie = "googtrans=" + v + ";path=/";
    document.cookie = "googtrans=" + v + ";path=/;SameSite=Lax";
  }

  function clearGoogTransCookie() {
    document.cookie = "googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
    document.cookie = "googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;SameSite=Lax";
  }

  function getCookie(name){
    const m = document.cookie.match(new RegExp("(^|;\\s*)" + name + "=([^;]*)"));
    return m ? decodeURIComponent(m[2]) : "";
  }

  function getLangFromGoogtransCookie(){
    const gt = getCookie("googtrans"); // e.g. /zh-TW/ja
    const m = gt.match(/^\/([^\/]+)\/([^\/]+)$/);
    if(!m) return null;
    return { from: m[1], to: m[2] };
  }

  // 語言來源：localStorage 優先，沒有就用 googtrans cookie
  function getSavedLangSafe() {
    const v = localStorage.getItem(SITE_LANG_KEY);
    if (v && v !== "null" && v !== "undefined") return v;

    const gt = getLangFromGoogtransCookie();
    if (gt && gt.to) return gt.to;

    return "original";
  }

  // 判斷目前頁面是否已被 Google Translate 套用
  function isTranslatedNow(){
    const de = document.documentElement;
    return !!(
      de.classList.contains("translated-ltr") ||
      de.classList.contains("translated-rtl") ||
      document.querySelector("iframe.goog-te-banner-frame") ||
      document.querySelector(".goog-te-spinner-pos")
    );
  }

  // 等待 goog-te-combo 出現後，指定語言並觸發 change
  function forceApplyLangByCombo(){
    const target = getSavedLangSafe();
    if (target === "original") return;

    let tries = 0;
    const maxTries = 50; // 10 秒
    const timer = setInterval(function(){
      tries++;

      const combo = document.querySelector("select.goog-te-combo");
      if (combo) {
        combo.value = target;
        combo.dispatchEvent(new Event("change"));
        clearInterval(timer);
        return;
      }

      if (tries >= maxTries) clearInterval(timer);
    }, 200);
  }

  // 進頁先把 cookie 套好（讓 element.js 初始化時讀得到）
  (function autoApplySavedLang(){
    const lang = getSavedLangSafe();
    if (lang === "original") clearGoogTransCookie();
    else setGoogTransCookie(SITE_FROM_LANG, lang); // 統一改回 /zh-TW/xx
  })();

  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: SITE_FROM_LANG,
      includedLanguages: SITE_LANG_LIST,
      autoDisplay: false
    }, 'google_translate_element');

    // 初始化後立刻強制套用一次（確保第一次載入就翻）
    forceApplyLangByCombo();
  }

  // 正常載入時保險再跑一次
  window.addEventListener("load", function(){
    const lang = getSavedLangSafe();
    if (lang === "original") clearGoogTransCookie();
    else setGoogTransCookie(SITE_FROM_LANG, lang);

    forceApplyLangByCombo();
  });

  // 返回上一頁（bfcache restore）時：onload 不會跑，所以一定要用 pageshow
  // 若 combo 套用後仍未翻譯 => 只 reload 一次（避免循環）
  window.addEventListener("pageshow", function(evt){
    const lang = getSavedLangSafe();
    if (lang === "original") return;

    // 先嘗試直接套用
    setGoogTransCookie(SITE_FROM_LANG, lang);
    forceApplyLangByCombo();

    // 再檢查：若沒翻譯，做一次性 reload 修復 bfcache 還原不完整
    setTimeout(function(){
      if (isTranslatedNow()) return;

      const key = "gt_bfcache_reload_once_contact";
      if (sessionStorage.getItem(key) === "1") {
        return;
      }
      sessionStorage.setItem(key, "1");
      location.reload();
    }, 700);
  });
</script>

<script>
/*
  ================================
  Formspree AJAX Submit (不跳頁)
  目的：
  - 使用者按「寄出」後，不離開本頁 contact.htm
  - 表單資料用 fetch 背景送到 Formspree
  - 成功/失敗用提示（本版已改為 DOM 提示，可翻譯）
*/
(function(){
  var form = document.getElementById('contactForm');
  if(!form) return;

  // ===== 你只需要改這一行 =====
  // 'FIXED_FULL'：固定格式完整（內文完整、每欄必出現）
  // 'SUBJECT_DYNAMIC'：主旨跟著留言主題變動
  var MAIL_MODE = 'FIXED_FULL';
  // ===========================

  // 讀取欄位值（不存在就回空字串）
  function getVal(name){
    var el = form.querySelector('[name="'+name+'"]');
    return el ? (el.value || '').trim() : '';
  }
  function getChecked(name){
    var el = form.querySelector('[name="'+name+'"]:checked');
    return el ? (el.value || '').trim() : '';
  }

  form.addEventListener('submit', function(e){
    e.preventDefault(); // 阻止瀏覽器依 action 跳轉到 formspree.io/thanks

    // 1) 先把所有欄位取出（留言主題欄位 name="subt"）
    var company = getVal('company_name');
    var person  = getVal('person_name');
    var gender  = getChecked('R1');         // 先生 / 女士
    var phone   = getVal('phone');
    var fax     = getVal('fax');
    var replyto = getVal('_replyto');       // email 欄位 name="_replyto"
    var way     = getVal('contact_way');    // Email聯絡/傳真聯絡/電話聯絡
    var subj    = getVal('subt');           // 留言主題 name="subt"
    var content = getVal('content');

    // 2) 組成固定格式完整內文（每一欄必出現）
    var lines = [
      '【JOEYPA 官網｜線上聯絡表單】',
      '----------------------------------------',
      '公司寶號：' + (company || '(未填)'),
      '聯絡人姓名：' + (person  || '(未填)'),
      '稱謂：'     + (gender  || '(未填)'),
      '聯絡電話：' + (phone   || '(未填)'),
      '傳真電話：' + (fax     || '(未填)'),
      '電子信箱：' + (replyto || '(未填)'),
      '聯絡方式：' + (way     || '(未填)'),
      '留言主題：' + (subj    || '(未填)'),
      '----------------------------------------',
      '【留言內容】',
      (content || '(未填)'),
      '----------------------------------------',
      '（以上由網站表單自動產生）'
    ];
    var fixedMessage = lines.join('\n');

    // 3) 準備送出
    var formData = new FormData(form);

    // 3-1) 強制塞入固定格式完整的內文欄位
    formData.set('message', fixedMessage);

    // 3-2) 主旨動態模式
    if(MAIL_MODE === 'SUBJECT_DYNAMIC'){
      var dynamicSubject = 'JOEYPA 官網｜線上聯絡表單';
      if(subj){
        dynamicSubject = 'JOEYPA 官網｜' + subj;
      }
      formData.set('_subject', dynamicSubject);
    }

    // 4) 送到 Formspree
    fetch(form.action, {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    })
    .then(function(res){
      if(res.ok){
        // ✅ 成功提示：醒目底色 + 10秒自動隱藏（可翻譯）
        var msg = document.getElementById('submitMsg');
        if (msg) {
          if (window.__submitMsgTimer) { clearTimeout(window.__submitMsgTimer); }
          msg.innerHTML = '表單已成功送出，我們會盡快與您聯絡，謝謝！';
          msg.style.backgroundColor = '#D1E7DD';
          msg.style.borderColor = '#198754';
          msg.style.color = '#0F5132';
          msg.style.display = 'block';
          window.__submitMsgTimer = setTimeout(function(){ msg.style.display = 'none'; }, 10000);
        }
        // 觸發一次語言下拉 change，讓動態顯示文字更容易被即時翻譯
        var combo = document.querySelector('select.goog-te-combo');
        if (combo) combo.dispatchEvent(new Event('change'));

        HTMLFormElement.prototype.reset.call(form);
      }else{
        return res.json().then(function(data){
          throw new Error(data && data.error ? data.error : 'Formspree 回應錯誤');
        }).catch(function(){
          throw new Error('Formspree 回應錯誤');
        });
      }
    })
    .catch(function(err){
      // ✅ 失敗提示：醒目底色 + 10秒自動隱藏（可翻譯）
      var msg = document.getElementById('submitMsg');
      if (msg) {
        if (window.__submitMsgTimer) { clearTimeout(window.__submitMsgTimer); }
        msg.innerHTML = '送出失敗：' + (err && err.message ? err.message : '請稍後再試') +
                        '<br><br>若仍無法送出，請改用上方 Email 按鈕或直接寄信。';
        msg.style.backgroundColor = '#F8D7DA';
        msg.style.borderColor = '#DC3545';
        msg.style.color = '#842029';
        msg.style.display = 'block';
        window.__submitMsgTimer = setTimeout(function(){ msg.style.display = 'none'; }, 10000);
      }
      var combo = document.querySelector('select.goog-te-combo');
      if (combo) combo.dispatchEvent(new Event('change'));
    });
  });
})();
</script>
