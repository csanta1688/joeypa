  .icon-item{

  }

  .icon-text{
    margin-top: 6px;

    overflow: hidden;
    text-overflow: ellipsis;

  /* ====== 公告五行跑馬燈（專業無縫版）====== */
  .notice-marquee{
    width: 650px;               /* 保持原本版面寬度 */
    display: inline-block;
    text-align: left;
    margin: 0 auto;
  }

  .notice-line{
    position: relative;
    overflow: hidden;
    height: 28px;
    line-height: 28px;
    margin: 14px 0;
    border-radius: 4px;
    padding: 0 8px;            /* 左右留邊 */
    box-sizing: border-box;
    font-size: 18px;   /* ← 在這裡改字體大小 */
  }

  /* 跑馬燈軌道（JS 會自動複製內容） */
  .marquee-track{
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    will-change: transform;
    animation-name: noticeMarquee;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-duration: var(--dur, 32s);  /* 每行獨立速度 */
  }

  /* 內容本體：這裡控制間隔空白（越小越緊） */
  .marquee-item{
    display: inline-block;
    white-space: nowrap;
    padding-right: 100px;        /* ✅空白更少：你可改 6px/8px */
  }

  /* 無縫關鍵：跑到 -50% */
  @keyframes noticeMarquee{
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* 滑鼠移上去暫停 */
  .notice-line:hover .marquee-track{
    animation-play-state: paused;
  }

  /* 五行指定色：底色 + 字色 */
  .line1{ background:#FFD400; color:#D00000; font-weight:700; }  /* 黃底紅字 */
  .line2{ background:#D00000; color:#0033CC; font-weight:700; }  /* 紅底藍字 */
  .line3{ background:#0033CC; color:#F3E6D0; font-weight:700; }  /* 藍底米白字 */
  .line4{ background:#F3E6D0; color:#0A7A2A; font-weight:700; }  /* 米白底綠字 */
  .line5{ background:#0A7A2A; color:#FFD400; font-weight:700; }  /* 綠底黃字 */

  <script>
    /* ===== Google 翻譯同步設定（index → main → 子頁）===== */
    const SITE_FROM_LANG = "zh-TW"; // 主站內容是繁中，統一以 zh-TW 為 source
    const SITE_LANG_KEY  = "site_lang";
    const SITE_LANG_LIST = "en,ja,ko,zh-CN,fr,de,es,vi,th,id,ar,fa,tr,zh-TW";

    function setGoogTransCookie(fromLang, toLang) {
      const v = "/" + fromLang + "/" + toLang;
      document.cookie = "googtrans=" + v + ";path=/";
      document.cookie = "googtrans=" + v + ";path=/;SameSite=Lax";
    }

    function clearGoogTransCookie() {
      document.cookie = "googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
      document.cookie = "googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;SameSite=Lax";
    }

    function getCookie(name){
      const m = document.cookie.match(new RegExp("(^|;\\s*)" + name + "=([^;]*)"));
      return m ? decodeURIComponent(m[2]) : "";
    }

    function getLangFromGoogtransCookie(){
      const gt = getCookie("googtrans"); // e.g. /zh-TW/ja
      const m = gt.match(/^\/([^\/]+)\/([^\/]+)$/);
      if(!m) return null;
      return { from: m[1], to: m[2] };
    }

    function getSavedLangSafe() {
      const v = localStorage.getItem(SITE_LANG_KEY);
      if (v && v !== "null" && v !== "undefined") return v;

      const gt = getLangFromGoogtransCookie();
      if (gt && gt.to) return gt.to;

      return "original";
    }

    function isTranslatedNow(){
      const de = document.documentElement;
      return !!(
        de.classList.contains("translated-ltr") ||
        de.classList.contains("translated-rtl") ||
        document.querySelector("iframe.goog-te-banner-frame") ||
        document.querySelector(".goog-te-spinner-pos")
      );
    }

    function forceApplyLangByCombo(){
      const target = getSavedLangSafe();
      if (target === "original") return;

      let tries = 0;
      const maxTries = 50; // 10 秒
      const timer = setInterval(function(){
        tries++;

        const combo = document.querySelector("select.goog-te-combo");
        if (combo) {
          combo.value = target;
          combo.dispatchEvent(new Event("change"));
          clearInterval(timer);
          return;
        }

        if (tries >= maxTries) clearInterval(timer);
      }, 200);
    }

    // 進頁先把 cookie 套好（讓 element.js 初始化時讀得到）
    (function autoApplySavedLang(){
      const lang = getSavedLangSafe();
      if (lang === "original") clearGoogTransCookie();
      else setGoogTransCookie(SITE_FROM_LANG, lang);
    })();

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: SITE_FROM_LANG,
        includedLanguages: SITE_LANG_LIST,
        autoDisplay: false
      }, 'google_translate_element');

      forceApplyLangByCombo();
    }

    window.addEventListener("load", function(){
      const lang = getSavedLangSafe();
      if (lang === "original") clearGoogTransCookie();
      else setGoogTransCookie(SITE_FROM_LANG, lang);

      forceApplyLangByCombo();
    });

    window.addEventListener("pageshow", function(evt){
      const lang = getSavedLangSafe();
      if (lang === "original") return;

      setGoogTransCookie(SITE_FROM_LANG, lang);
      forceApplyLangByCombo();

      setTimeout(function(){
        if (isTranslatedNow()) return;

        const key = "gt_bfcache_reload_once_main";
        if (sessionStorage.getItem(key) === "1") return;
        sessionStorage.setItem(key, "1");
        location.reload();
      }, 700);
    });
  </script>

<script>
  var rector=3, stopit=0, a=1, shake=null;
  function init(which){
    stopit=0;
    shake=which;
    shake.style.left=0;
    shake.style.top=0;
  }
  function rattleimage(){
    if (stopit) return;
    if (a==1) shake.style.top=(parseInt(shake.style.top)||0)+rector;
    else if (a==2) shake.style.left=(parseInt(shake.style.left)||0)+rector;
    else if (a==3) shake.style.top=(parseInt(shake.style.top)||0)-rector;
    else shake.style.left=(parseInt(shake.style.left)||0)-rector;
    a=(a<4)?a+1:1;
    setTimeout(rattleimage,50);
  }
  function stoprattle(which){
    stopit=1;
    which.style.left=0;
    which.style.top=0;
  }
</script>

<!-- 跑馬燈：安全無縫自動複製 + 每行不同速度 + hover 暫停 + 手機加速 -->
<script>
(function(){

  // 手機/觸控設備加速倍率（越小越快）
  const TOUCH_SPEED_FACTOR = 0.75;

  function isTouchDevice(){
    return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  }

  function prepareMarqueeLine(line){
    try{
      const track = line.querySelector('.marquee-track');
      if(!track) return;

      const firstItem = track.querySelector('.marquee-item');
      if(!firstItem) return;

      const text = firstItem.textContent.trim();
      if(!text) return;

      // 避免重複初始化（翻譯或重整時）
      if(track.dataset.ready === "1") return;

      // 建立基底
      track.innerHTML = "";
      const base = document.createElement('span');
      base.className = 'marquee-item';
      base.textContent = text;
      track.appendChild(base);

      // 讓內容至少覆蓋到容器 2 倍寬，空白最少、循環更密
      const containerWidth = line.clientWidth || 650;
      let baseW = base.offsetWidth;

      // 若首次量不到寬（極少數情況），延後再試，不拋錯
      if(!baseW || baseW < 10){
        setTimeout(function(){
          // 清掉 ready 讓它可再初始化
          track.dataset.ready = "0";
          prepareMarqueeLine(line);
        }, 200);
        return;
      }

      let totalWidth = baseW;
      while(totalWidth < containerWidth * 2){
        const clone = base.cloneNode(true);
        track.appendChild(clone);
        totalWidth += baseW;
        if(track.children.length > 24) break; // 安全上限
      }

      // 再複製「整段」一次，讓 -50% 真正無縫
      const clones = track.cloneNode(true);
      while(clones.firstChild){
        track.appendChild(clones.firstChild);
      }

      track.dataset.ready = "1";
    }catch(e){
      // 任何錯誤都不影響後面日期/公司顯示
      console.warn("Marquee init skipped:", e);
    }
  }

  function applyTouchSpeedBoost(){
    if(!isTouchDevice()) return;

    document.querySelectorAll('.notice-line').forEach(line=>{
      const dur = getComputedStyle(line).getPropertyValue('--dur').trim();
      if(!dur.endsWith('s')) return;

      const sec = parseFloat(dur);
      if(!isFinite(sec) || sec <= 0) return;

      const newSec = Math.max(4, sec * TOUCH_SPEED_FACTOR);
      line.style.setProperty('--dur', newSec + 's');
    });
  }

  function initAll(){
    document.querySelectorAll('.notice-line').forEach(prepareMarqueeLine);
    applyTouchSpeedBoost();
  }

  // 等 DOM 全穩定後再初始化，避免干擾其他 script（含日期）
  window.addEventListener('load', function(){
    setTimeout(initAll, 200);
  });

  // 需要時可手動呼叫（例如你未來用 JS 更新公告文字）
  window.noticeMarqueeRefresh = function(){
    // 允許重新初始化
    document.querySelectorAll('.notice-line .marquee-track').forEach(t=>t.dataset.ready="0");
    initAll();
  };

})();
</script>
